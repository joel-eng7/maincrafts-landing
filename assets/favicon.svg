<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#4F8CFF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="facet-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F8CFF" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="facet-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#4F8CFF" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded hexagon -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#101625" stroke="url(#primary-grad)" stroke-width="1.5" />
  
  <!-- Stylized geometric craft "M" icon -->
  <g filter="url(#glow-blur)">
    <!-- Left Pillar -->
    <path d="M12 34V14L20 22V34H12Z" fill="url(#facet-1)" />
    <!-- Center Peak -->
    <path d="M20 22L24 16L28 22V34H20V22Z" fill="url(#primary-grad)" />
    <!-- Right Pillar -->
    <path d="M28 22L36 14V34H28V22Z" fill="url(#facet-2)" />
    <!-- Cyber Core Dot -->
    <circle cx="24" cy="23" r="2.5" fill="#FFFFFF" />
  </g>
</svg>
